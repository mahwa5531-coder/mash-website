<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     viewBox="0 0 512 512" width="512" height="512">
  <defs>
    
    <!-- Linear Gradients for Optical Depth -->
    <linearGradient id="grad-cyan-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="60%" stop-color="#00C8FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="grad-blue-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#3A0CA3" />
    </linearGradient>

    <linearGradient id="grad-core-thrust" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#0033CC" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="icon-glass" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1420" />
      <stop offset="50%" stop-color="#090C14" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>
    <linearGradient id="icon-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0066FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Squircle Container with Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#icon-bg)" filter="url(#icon-glass)" />
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="none" stroke="url(#icon-border)" stroke-width="2.5" />

  <!-- Subtle Radial Backlight -->
  <circle cx="256" cy="240" r="160" fill="#0052FF" opacity="0.15" filter="url(#glow)" />

  <!-- Logo Mark centered -->
  <g transform="translate(76, 76) scale(0.72)">
    <!-- Glow Layer -->
    <g opacity="0.35" filter="url(#glow)">
      <path d="M 95,375 C 106,275 154,142 242,72 C 245,69 249,69 251,72 L 251,114 C 251,118 248,122 244,126 C 180,188 154,260 148,348 L 148,375 Z" fill="#00C8FF" />
      <path d="M 405,375 C 394,275 346,142 258,72 C 255,69 251,69 249,72 L 249,114 C 249,118 252,122 256,126 C 320,188 346,260 352,348 L 352,375 Z" fill="#0052FF" />
      <path d="M 250,165 C 252,165 255,168 257,171 L 305,258 C 308,263 305,270 299,270 L 264,270 C 260,270 256,274 255,278 L 251,335 C 251,337 249,337 249,335 L 245,278 C 244,274 240,270 236,270 L 201,270 C 195,270 192,263 195,258 L 243,171 C 245,168 248,165 250,165 Z" fill="#00F2FE" />
    </g>
    <!-- Crisp Vector Paths -->
    <path d="M 95,375 C 106,275 154,142 242,72 C 245,69 249,69 251,72 L 251,114 C 251,118 248,122 244,126 C 180,188 154,260 148,348 L 148,375 Z" fill="url(#grad-cyan-blue)" />
    <path d="M 405,375 C 394,275 346,142 258,72 C 255,69 251,69 249,72 L 249,114 C 249,118 252,122 256,126 C 320,188 346,260 352,348 L 352,375 Z" fill="url(#grad-blue-indigo)" />
    <path d="M 250,165 C 252,165 255,168 257,171 L 305,258 C 308,263 305,270 299,270 L 264,270 C 260,270 256,274 255,278 L 251,335 C 251,337 249,337 249,335 L 245,278 C 244,274 240,270 236,270 L 201,270 C 195,270 192,263 195,258 L 243,171 C 245,168 248,165 250,165 Z" fill="url(#grad-core-thrust)" filter="url(#shadow-soft)" />
  </g>
</svg>
