<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     viewBox="0 0 500 500" width="500" height="500"
     style="background-color: #07090E;">
  <defs>
    
    <!-- Linear Gradients for Optical Depth -->
    <linearGradient id="grad-cyan-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="60%" stop-color="#00C8FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="grad-blue-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#3A0CA3" />
    </linearGradient>

    <linearGradient id="grad-core-thrust" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#0033CC" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="icon-glass" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

  </defs>

  <!-- Construction Grid Lines -->
  <g opacity="0.25">
    <!-- Centerlines -->
    <line x1="250" y1="20" x2="250" y2="480" stroke="#00F2FE" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="20" y1="240" x2="480" y2="240" stroke="#00F2FE" stroke-width="1" stroke-dasharray="4,4" />

    <!-- 60-degree Isometric Triangle Guides -->
    <line x1="250" y1="72" x2="95" y2="375" stroke="#00F2FE" stroke-width="1" />
    <line x1="250" y1="72" x2="405" y2="375" stroke="#00F2FE" stroke-width="1" />
    <line x1="95" y1="375" x2="405" y2="375" stroke="#00F2FE" stroke-width="1" />

    <!-- Stream Channel Offsets (14px) -->
    <line x1="243" y1="50" x2="243" y2="450" stroke="#FF0077" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="257" y1="50" x2="257" y2="450" stroke="#FF0077" stroke-width="0.8" stroke-dasharray="2,2" />

    <!-- Golden Ratio Tangent Circles -->
    <circle cx="250" cy="240" r="185" fill="none" stroke="#00F2FE" stroke-width="0.8" stroke-dasharray="6,6" />
    <circle cx="250" cy="240" r="114" fill="none" stroke="#FF0077" stroke-width="0.8" stroke-dasharray="4,4" />
    <circle cx="250" cy="165" r="45" fill="none" stroke="#00F2FE" stroke-width="0.8" stroke-dasharray="2,2" />
  </g>

  <!-- Underlying Mark Silhouette (Wireframe Mode) -->
  <g fill="none" stroke="#00F2FE" stroke-width="2">
    <path d="M 95,375 C 106,275 154,142 242,72 C 245,69 249,69 251,72 L 251,114 C 251,118 248,122 244,126 C 180,188 154,260 148,348 L 148,375 Z" opacity="0.85" />
    <path d="M 405,375 C 394,275 346,142 258,72 C 255,69 251,69 249,72 L 249,114 C 249,118 252,122 256,126 C 320,188 346,260 352,348 L 352,375 Z" opacity="0.85" />
    <path d="M 250,165 C 252,165 255,168 257,171 L 305,258 C 308,263 305,270 299,270 L 264,270 C 260,270 256,274 255,278 L 251,335 C 251,337 249,337 249,335 L 245,278 C 244,274 240,270 236,270 L 201,270 C 195,270 192,263 195,258 L 243,171 C 245,168 248,165 250,165 Z" stroke="#FF0077" stroke-width="2" opacity="0.9" />
  </g>

  <!-- Key Coordinate Nodes / Anchor Points -->
  <g fill="#00F2FE">
    <circle cx="250" cy="72" r="4" fill="#FFFFFF" stroke="#00F2FE" stroke-width="2" />
    <circle cx="95" cy="375" r="4" fill="#FFFFFF" stroke="#00F2FE" stroke-width="2" />
    <circle cx="405" cy="375" r="4" fill="#FFFFFF" stroke="#00F2FE" stroke-width="2" />
    <circle cx="148" cy="375" r="3" />
    <circle cx="352" cy="375" r="3" />
    <circle cx="250" cy="165" r="3" fill="#FF0077" />
    <circle cx="305" cy="258" r="3" fill="#FF0077" />
    <circle cx="195" cy="258" r="3" fill="#FF0077" />
    <circle cx="251" cy="335" r="3" fill="#FF0077" />
  </g>

  <!-- Dimension Annotation Callouts -->
  <text x="255" y="55" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00F2FE">APEX [250, 72]</text>
  <text x="262" y="220" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FF0077">GAP: 14px</text>
  <text x="315" y="385" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F2FE">30° CHAMFER</text>
</svg>
