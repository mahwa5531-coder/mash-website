<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     viewBox="0 0 900 300" width="900" height="300"
     style="background-color: transparent;">
  <defs>
    
    <!-- Linear Gradients for Optical Depth -->
    <linearGradient id="grad-cyan-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="60%" stop-color="#00C8FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="grad-blue-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#3A0CA3" />
    </linearGradient>

    <linearGradient id="grad-core-thrust" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#0033CC" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="icon-glass" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

  </defs>

  <g id="layer-brandmark" transform="translate(40, 15) scale(0.54)">
    <!-- Ambient back-glow -->
    <g opacity="0.4" filter="url(#glow)">
      <path d="M 95,375 C 106,275 154,142 242,72 C 245,69 249,69 251,72 L 251,114 C 251,118 248,122 244,126 C 180,188 154,260 148,348 L 148,375 Z" fill="#00C8FF" />
      <path d="M 405,375 C 394,275 346,142 258,72 C 255,69 251,69 249,72 L 249,114 C 249,118 252,122 256,126 C 320,188 346,260 352,348 L 352,375 Z" fill="#0052FF" />
      <path d="M 250,165 C 252,165 255,168 257,171 L 305,258 C 308,263 305,270 299,270 L 264,270 C 260,270 256,274 255,278 L 251,335 C 251,337 249,337 249,335 L 245,278 C 244,274 240,270 236,270 L 201,270 C 195,270 192,263 195,258 L 243,171 C 245,168 248,165 250,165 Z" fill="#00F2FE" />
    </g>
    <!-- Sharp Vector Facets -->
    <path id="left-wing" d="M 95,375 C 106,275 154,142 242,72 C 245,69 249,69 251,72 L 251,114 C 251,118 248,122 244,126 C 180,188 154,260 148,348 L 148,375 Z" fill="url(#grad-cyan-blue)" />
    <path id="right-wing" d="M 405,375 C 394,275 346,142 258,72 C 255,69 251,69 249,72 L 249,114 C 249,118 252,122 256,126 C 320,188 346,260 352,348 L 352,375 Z" fill="url(#grad-blue-indigo)" />
    <path id="thrust-core" d="M 250,165 C 252,165 255,168 257,171 L 305,258 C 308,263 305,270 299,270 L 264,270 C 260,270 256,274 255,278 L 251,335 C 251,337 249,337 249,335 L 245,278 C 244,274 240,270 236,270 L 201,270 C 195,270 192,263 195,258 L 243,171 C 245,168 248,165 250,165 Z" fill="url(#grad-core-thrust)" filter="url(#shadow-soft)" />
  </g>

  <!-- Typography: Custom Geometrically Tracked Wordmark -->
  <g id="layer-typography" transform="translate(350, 150)">
    <!-- Primary Name -->
    <text x="0" y="0"
          font-family="'Space Grotesk', 'Montserrat', 'Segoe UI', sans-serif"
          font-size="64"
          font-weight="800"
          letter-spacing="14px"
          fill="#FFFFFF">AETHER</text>

    <!-- Subtitle / Industry Descriptor -->
    <text x="5" y="44"
          font-family="'JetBrains Mono', 'Segoe UI Mono', monospace"
          font-size="16"
          font-weight="600"
          letter-spacing="10px"
          fill="#00F2FE"
          opacity="0.9">DYNAMICS</text>

    <!-- Aerodynamic Flow Accent Line -->
    <line x1="5" y1="62" x2="420" y2="62" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4, 4" />
    <circle cx="420" cy="62" r="2.5" fill="#00F2FE" />
  </g>
</svg>
