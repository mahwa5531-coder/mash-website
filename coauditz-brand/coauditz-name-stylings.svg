<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080" width="1920" height="1080"
     style="background-color: #06080D;">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#06080D" />

  <!-- Header -->
  <g transform="translate(80, 50)">
    <text x="0" y="24" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="4px" fill="#FFFFFF">CO·AUDITZ // STANDALONE TYPOGRAPHIC STYLING RESEARCH</text>
    <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2px" fill="#00F2FE" opacity="0.8">5 ELITE STYLING DIRECTIONS • COMPARATIVE ANALYSIS • VISUAL WEIGHT &amp; ENTERPRISE TRUST</text>
    <line x1="0" y1="70" x2="1760" y2="70" stroke="#161F33" stroke-width="1.5" />
    <line x1="0" y1="70" x2="350" y2="70" stroke="#00F2FE" stroke-width="2" />
  </g>

  <!-- Row 1: Option 1 (Hero / Best Looking) -->
  <g transform="translate(80, 150)">
    <rect width="1760" height="150" rx="14" fill="url(#card-grad)" stroke="#00F2FE" stroke-width="1.5" />
    <g transform="translate(40, 45)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F2FE">OPTION 01 // MODERN DEVELOPER AESTHETIC (RECOMMENDED BEST LOOKING)</text>
      <text x="0" y="24" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Lowercase with Illuminated Accent Dot</text>
      <text x="0" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7E8DA6">Inspired by Linear, Stripe &amp; Supabase. The cyan dot physically balances the trailing 'z'.</text>
    </g>
    <!-- Render -->
    <g transform="translate(1300, 92)">
      <text x="-16" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="400" fill="#DE7F44">co</text>
      <circle cx="0" cy="-18" r="4.5" fill="#00F2FE" />
      <text x="16" text-anchor="start" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">auditz</text>
    </g>
  </g>

  <!-- Row 2: Option 2 (Dual-Tone Caps) -->
  <g transform="translate(80, 325)">
    <rect width="1760" height="150" rx="14" fill="url(#card-grad)" stroke="#161F33" stroke-width="1.5" />
    <g transform="translate(40, 45)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94A3B8">OPTION 02 // DUAL-TONE ENTERPRISE CAPS</text>
      <text x="0" y="24" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Thin Lowercase "co" + Architectural Bold "AUDITZ"</text>
      <text x="0" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7E8DA6">High visual contrast. Creates clean separation between 'co-pilot' and official 'AUDIT'.</text>
    </g>
    <!-- Render -->
    <g transform="translate(1260, 92)">
      <text x="0" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="300" fill="#00F2FE">co</text>
      <text x="56" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="800" letter-spacing="4px" fill="#FFFFFF">AUDITZ</text>
    </g>
  </g>

  <!-- Row 3: Option 3 (Institutional CoAudit) -->
  <g transform="translate(80, 500)">
    <rect width="1760" height="150" rx="14" fill="url(#card-grad)" stroke="#161F33" stroke-width="1.5" />
    <g transform="translate(40, 45)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94A3B8">OPTION 03 // THE BILLION-DOLLAR ENTERPRISE STANDARD</text>
      <text x="0" y="24" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">CoAudit (TitleCase, Zero Slang)</text>
      <text x="0" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7E8DA6">Instant Fortune 500 &amp; Big-4 CPA credibility. Matches Datadog, Chainalysis, Palantir.</text>
    </g>
    <!-- Render -->
    <g transform="translate(1300, 92)">
      <text x="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="50" font-weight="800" letter-spacing="-1px" fill="#FFFFFF">Co<tspan fill="#00F2FE">Audit</tspan></text>
    </g>
  </g>

  <!-- Row 4: Option 4 (Terminal Slash) -->
  <g transform="translate(80, 675)">
    <rect width="1760" height="150" rx="14" fill="url(#card-grad)" stroke="#161F33" stroke-width="1.5" />
    <g transform="translate(40, 45)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94A3B8">OPTION 04 // CYBERSECURITY &amp; TERMINAL SLASH</text>
      <text x="0" y="24" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">CO / AUDITZ (Monospaced Technical)</text>
      <text x="0" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7E8DA6">Cryptographic ledger proof and automated code-scanning tone.</text>
    </g>
    <!-- Render -->
    <g transform="translate(1260, 92)">
      <text x="0" font-family="'JetBrains Mono', monospace" font-size="44" font-weight="700" letter-spacing="2px" fill="#FFFFFF">CO<tspan fill="#00F2FE" font-weight="300">/</tspan>AUDITZ</text>
    </g>
  </g>

  <!-- Row 5: Option 5 (CamelCase Monolith) -->
  <g transform="translate(80, 850)">
    <rect width="1760" height="150" rx="14" fill="url(#card-grad)" stroke="#161F33" stroke-width="1.5" />
    <g transform="translate(40, 45)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94A3B8">OPTION 05 // TRADITIONAL B2B SAAS FAMILIARITY</text>
      <text x="0" y="24" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">CoAuditz (Geometric TitleCase)</text>
      <text x="0" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7E8DA6">Clean, balanced, single-flow wordmark without special symbols.</text>
    </g>
    <!-- Render -->
    <g transform="translate(1320, 92)">
      <text x="0" font-family="'Space Grotesk', sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">CoAuditz</text>
    </g>
  </g>
</svg>
