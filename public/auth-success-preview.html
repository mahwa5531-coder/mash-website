<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication Successful · Mash</title>
  <link rel="icon" type="image/svg+xml" href="/brand-logo.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: #FFFFFF;
      color: #1F2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      user-select: none;
    }

    .container {
      max-width: 640px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Brand Lockup: Logo + Text */
    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .brand-name {
      font-size: 32px;
      font-weight: 600;
      color: #1F2937;
      letter-spacing: -0.5px;
    }

    /* Primary Heading */
    h1 {
      font-size: 32px;
      font-weight: 500;
      color: #111827;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
    }

    /* Subtext with fallback link */
    .subtext {
      font-size: 14px;
      color: #6B7280;
      line-height: 1.6;
    }
    .subtext a {
      color: #2563EB;
      text-decoration: underline;
      cursor: pointer;
      font-weight: 500;
    }
    .subtext a:hover {
      color: #1D4ED8;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Brand Lockup -->
    <div class="brand-lockup">
      <div class="brand-logo">
        <img src="/brand-logo.svg" alt="Mash">
      </div>
      <div class="brand-name">Mash</div>
    </div>

    <!-- Main Clean Headline -->
    <h1>You have successfully authenticated.</h1>

    <!-- Fallback Redirect Notice -->
    <p class="subtext">
      You should be redirected back to the product. <a id="redirectLink" href="mash://auth/callback?code=mcode_live" onclick="handleLaunch(event)">Click here</a> if not working.
    </p>
  </div>

  <script>
    // Extract code from URL query parameters (?code=... or ?grant=...)
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || 'mcode_demo';
    const targetUrl = 'mash://auth/callback?code=' + encodeURIComponent(code);

    // Update real link href
    const linkEl = document.getElementById('redirectLink');
    if (linkEl) {
      linkEl.href = targetUrl;
    }

    function handleLaunch(e) {
      // 1. Direct browser navigation to native OS protocol
      window.location.href = targetUrl;

      // 2. Localhost loopback bridge for desktop app if already running
      try {
        fetch('http://localhost:8000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code })
        }).catch(function() {});
      } catch (err) {}
    }

    // Auto-invoke on arrival
    window.addEventListener('load', function() {
      // Built-in Chromium automatically opens its native prompt if mash:// is registered
      window.location.href = targetUrl;
    });
  </script>

</body>
</html>
